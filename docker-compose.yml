services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lumia-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lumia

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lumia-queue
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      RUN_MIGRATIONS: "false"
    command: php artisan queue:work database --sleep=2 --tries=3 --timeout=180
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - lumia

  nginx:
    image: nginx:1.27-alpine
    container_name: lumia-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - lumia

  mysql:
    image: mysql:8.0
    container_name: lumia-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lumia
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: lumia
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - lumia_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lumia

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lumia-tunnel
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - lumia

volumes:
  lumia_mysql:

networks:
  lumia:
    driver: bridge
